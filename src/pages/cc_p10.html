<!doctype html>
<html lang="ko">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="format-detection" content="telephone=no" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta charset="utf-8" />
  <title>Crime & Chase</title>
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta property="og:title" content="" />
  <meta property="og:url" content="" />
  <meta property="og:image" content="" />
  <meta property="og:description" content="" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
  <link href="../assets/styles/style.css" type="text/css" rel="stylesheet" />
  <link href="../assets/styles/style2.css" type="text/css" rel="stylesheet" />
  <style>
    .thumbnail {
      position: relative;
      width: 28rem;
      border-radius: 1rem;
      overflow: hidden;
      background-color: #444;
      margin: 0 auto;
      margin-top: 6rem;
    }

    .thumbnail::before {
      content: "";
      display: block;
      width: 100%;
      padding-top: 100%;
    }

    .thumbnail img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 1rem;
      background-color: #444;
    }

    .pay-column {
      width: 28rem;
      margin: 4rem auto 0;
      max-width: 100%;
    }

    .pay-column .column-box .column+.column {
      font-size: 2rem;
    }

    .pay-column .column-box .ico-apt-logo {
      width: 1.6rem;
      height: 1.6rem;
    }

    .btn-center {
      width: 28rem;
      margin: 0 auto;
      margin-top: 6rem;
      display: flex;
    }

    .btn-center .btn {
      flex: 1;
    }

    .btn-center .btn+.btn {
      margin-left: 1.5rem;
    }

    @media (max-width: 767px) {
      .thumbnail {
        margin-top: 4rem;
        width: 22rem;
      }

      .pay-column .column-box+.column-box {
        margin-top: 1.5rem;
      }

      .btn-center {
        margin-top: 4rem;
      }
    }
  </style>
</head>

<body>
  <div id="wrap">
    @@include('pathPagesInclude/_header.html', {isLogin:true})

    <div id="container">
      <div id="content">
        <div class="container-visual-area">
          <div class="visual-area">
            <div class="visual-img-box">
              <img src="../assets/images/visual_bg_img06.jpg" alt="">
            </div>
            <div class="visual-txt">
              <h2 class="title">
                <span class="public-txt">STO</span>
                <span class="public-txt type02">RE</span>
              </h2>
            </div>
            <!-- 라우트 이동할떄 setFn.visualText();  실행 필요 -->
          </div>
          <div class="breadcrunb-area">
            <ul class="breadcrunb-list">
              <li class="breadcrunb-item">
                <a href="" class="breadcrunb-link f-bar-bold">HOME</a>
              </li>
              <li class="breadcrunb-item">
                <a href="" class="breadcrunb-link f-bar-bold">STORE</a>
              </li>
            </ul>
          </div>
        </div>
        <div class="store-container-page done">
          <h3 class="public-txt f-40 public-title">
            <span class="white">PURCHASE</span> COMPLETE !
          </h3>
          <div class="thumbnail">
            <img src="https://img.pikbest.com/origin/10/13/16/0pIkbEsTwpIkbEsTubI.jpg!f305cw" alt="">
          </div>
          <div class="pay-column f-bar-md">
            <div class="column-box">
              <div class="column">Purchase Items</div>
              <div class="column ellipsis">160 Gem</div>
            </div>
            <div class="column-box">
              <div class="column">Count</div>
              <div class="column">1</div>
            </div>
            <div class="column-box">
              <div class="column">Payment Amount</div>
              <div class="column">
                <i class="ico-apt-logo" aria-hidden="true"></i>
                3,454.76
              </div>
            </div>
          </div>
          <div class="btn-center">
            <button type="button" class="btn">
              <span class="txt">STORE</span>
            </button>
            <button type="button" class="btn">
              <span class="txt">MY ASSET</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    @@include('pathPagesInclude/_footer.html')
  </div>
  <div class="dimm"></div>

  </script>
</body>

</html>
